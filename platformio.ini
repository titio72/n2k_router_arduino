; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


;add library
;adafruit/Adafruit SSD1306
;and set DO_DISPLAY=1
;to enable the oled display
;
;GPS_TYPE	0 -> Dummy
;			1 -> I2C (u-blox lib is required)
;			2 -> UART (u-blox lib is required)
;DO_VE_DIRECT	0 -> disabled
;				1 -> enabled
;DO_TACHOMETER	0 -> disabled
;				1 -> enabled
;DO_DISPLAY		0 -> disabled
;				1 -> enabled

[env]
build_flags = -std=gnu++2a
build_unflags = -std=gnu++11
upload_speed = 115200
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_type = debug
monitor_filters = esp32_exception_decoder
test_build_src = yes
lib_deps =
	https://github.com/ttlappalainen/NMEA2000.git
	adafruit/Adafruit BME280 Library
	beegee-tokyo/DHT sensor library for ESPx@
	https://github.com/sparkfun/SparkFun_u-blox_GNSS_Arduino_Library.git
	davidarmstrong/WMM_Tinier
	adafruit/Adafruit SSD1306
	https://github.com/titio72/n2k_tools_libs.git

[env:esp32-s3-3-0]
platform = espressif32 @ 6.9.0
framework = arduino
board = esp32-s3-fh4r2_1
upload_port = /dev/ttyACM0
upload_speed = ${env.upload_speed}
monitor_port = ${env:esp32-s3-3-0.upload_port}
monitor_speed = ${env.monitor_speed}
build_type = release
build_flags =
	-D TWAI_CAN_DRIVER=1
	-D CAN_TX_PIN=GPIO_NUM_12
	-D CAN_RX_PIN=GPIO_NUM_13
	-D DO_VE_DIRECT=1
	-D VE_DIRECT_RX_PIN=GPIO_NUM_1
	-D VE_DIRECT_TX_PIN=GPIO_NUM_2
	-D GPS_TYPE=1
	-D GPS_TX_PIN=GPIO_NUM_7
	-D GPS_RX_PIN=GPIO_NUM_8
	-D DHT_PIN=-1
	-D LED_PIN=GPIO_NUM_6
	-D LED_PIN_GPS=-1
	-D LED_PIN_N2K=-1
	-D SDA_PIN=GPIO_NUM_10
    -D SCL_PIN=GPIO_NUM_9
	-D DO_TACHOMETER=1
	-D ENGINE_RPM_PIN=GPIO_NUM_5
	-D ENGINE_RPM_SIM_PIN=-1
	-D DO_DISPLAY=0
	-D WATER_TEMP_PIN=GPIO_NUM_3
	-D STW_PADDLE_PIN=GPIO_NUM_4
lib_deps =
	${env.lib_deps}
	https://github.com/jiauka/NMEA2000_esp32xx.git
	h2zero/NimBLE-Arduino @ 2.5.0
lib_ignore = BLE

